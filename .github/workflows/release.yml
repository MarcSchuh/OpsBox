name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.3.0"

# Serialize release runs: concurrent runs race on the gh-pages push
# (the loser is rejected with 'fetch first'). Queued runs re-clone
# gh-pages after the previous run finished, so the push is clean.
concurrency:
  group: apt-repository-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for version detection

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            .uv/cache
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Determine version (bump patch on dependency updates)
        id: get-version
        run: |
          LOCK_CHANGED=false
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- uv.lock | grep -q .; then
            LOCK_CHANGED=true
          fi

          extract_version() {
            grep -E '^version\s*=' "$1" | head -1 | sed -E 's/version\s*=\s*"([^"]+)"/\1/'
          }

          VERSION="$(extract_version pyproject.toml)"
          echo "pyproject.toml version: ${VERSION}"

          if [ "${LOCK_CHANGED}" = "true" ] && git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            IFS='.' read -r MAJ MIN PAT <<< "${VERSION}"
            NEW_VERSION="${MAJ}.${MIN}.$((PAT + 1))"
            sed -i -E "0,/^version\s*=\s*\"[^\"]+\"/s//version = \"${NEW_VERSION}\"/" pyproject.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml
            git commit -m "Version bump to ${NEW_VERSION}"
            git push
            VERSION="${NEW_VERSION}"
            echo "Dependency update merged and version already released, bumped to ${NEW_VERSION}"
          else
            echo "No version bump needed (lock changed: ${LOCK_CHANGED}, tag exists: $(git rev-parse "v${VERSION}" >/dev/null 2>&1 && echo yes || echo no))"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION}"

      - name: Build all executables
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_notifier.sh
          ./scripts/build_check_mails.sh
          ./scripts/build_db_backup.sh
          ./scripts/build_encrypted_mail.sh
          ./scripts/build_restic_backup.sh
          ./scripts/build_rsync_manager.sh
          ./scripts/build_health_monitor.sh
          ./scripts/build_kvm_snapshot_manager.sh

      - name: Verify all builds
        run: |
          echo "Checking built executables..."
          ls -lh dist/
          for exe in notifier check_mails db_backup encrypted_mail restic_backup rsync_manager health_monitor kvm_snapshot_manager; do
            if [ ! -f "dist/$exe" ]; then
              echo "❌ Missing executable: dist/$exe"
              exit 1
            fi
            echo "✅ $exe: $(du -h dist/$exe | cut -f1)"
          done

      - name: Package as .deb
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar -xz nfpm
          sed "s/^version: .*/version: ${{ steps.get-version.outputs.version }}/" nfpm.yaml > dist/nfpm-run.yaml
          ./nfpm package -f dist/nfpm-run.yaml -p deb -t dist/
          rm nfpm dist/nfpm-run.yaml
          ls -lh dist/*.deb

      - name: Publish APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "::error::Repository secret APT_GPG_PRIVATE_KEY is not set. Add it (armored GPG private key of the APT repo signing key), then re-run."
            exit 1
          fi

          if [ -n "${APT_GPG_PASSPHRASE}" ]; then
            echo "Signing key is passphrase-protected (APT_GPG_PASSPHRASE is set)"
            SIGN_ARGS=(--pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE}")
          else
            echo "Signing key is unprotected (APT_GPG_PASSPHRASE is not set)"
            SIGN_ARGS=()
          fi

          sudo apt-get install -y -qq apt-utils
          export GNUPGHOME="$(mktemp -d)"
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --armor --export > KEY.asc

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --single-branch --branch gh-pages "${REPO_URL}" apt-repo; then
            mkdir apt-repo
            cd apt-repo
            git init -b gh-pages
            git remote add origin "${REPO_URL}"
          fi

          cd apt-repo
          touch .nojekyll
          mkdir -p pool/main/o/opsbox dists/stable/main/binary-amd64
          cp ../dist/opsbox_*_amd64.deb pool/main/o/opsbox/

          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -k -9 -f dists/stable/main/binary-amd64/Packages

          cd dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="OpsBox" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="OpsBox APT Repository" \
            release . > Release
          gpg --batch --yes "${SIGN_ARGS[@]}" --clearsign --output InRelease Release
          gpg --batch --yes "${SIGN_ARGS[@]}" --armor --detach-sign --output Release.gpg Release

          cd ../..
          mv ../KEY.asc .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No repository changes to publish"
          else
            git commit -m "Release opsbox ${{ steps.get-version.outputs.version }}"
            git push origin gh-pages
          fi

      - name: Create release tag if it doesn't exist
        id: create-tag
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG="v${VERSION}"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Creating new tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create-tag.outputs.tag }}
          name: Release ${{ steps.create-tag.outputs.tag }}
          body: |
            ## Release ${{ steps.create-tag.outputs.tag }}

            This release includes the following executables:
            - `notifier` - Notification utility
            - `check_mails` - Mail checking utility
            - `db_backup` - Database backup utility
            - `encrypted_mail` - Encrypted mail utility
            - `restic_backup` - Restic backup utility
            - `rsync_manager` - Rsync management utility
            - `health_monitor` - Health monitoring utility
            - `kvm_snapshot_manager` - KVM snapshot management utility

            ### Installation
            Download the executable you need and make it executable:
            ```bash
            chmod +x <executable-name>
            ```
          files: |
            dist/notifier
            dist/check_mails
            dist/db_backup
            dist/encrypted_mail
            dist/restic_backup
            dist/rsync_manager
            dist/health_monitor
            dist/kvm_snapshot_manager
            dist/opsbox_*_amd64.deb
          draft: false
          prerelease: false

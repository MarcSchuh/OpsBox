name: Version Bump on Dependabot PRs

# Automatically bumps the PATCH version in pyproject.toml on the dependency
# update PR, and pushes the change back into the PR branch.
#
# The PR is created by dependency-updater.yml with DEPS_PR_TOKEN (a PAT).
# Because of that, these pull_request runs no longer require maintainer
# approval and get a normal GITHUB_TOKEN with the permissions declared
# below. Commits pushed with GITHUB_TOKEN do not re-trigger workflows,
# so there is no loop. `pull_request_target` is intentionally avoided.
# If DEPS_PR_TOKEN is not configured, the update PR falls back to being
# created with GITHUB_TOKEN by github-actions[bot], whose actor never
# matches here.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bump-version:
    # Only run for the dependency update PR branch.
    if: github.head_ref == 'dependabot/update-dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump PATCH version (idempotent)
        id: bump
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          extract_version() {
            grep -E '^version = "' "$1" | head -1 | sed -E 's/version = "([^"]+)"/\1/'
          }

          HEAD_VERSION="$(extract_version pyproject.toml)"
          BASE_VERSION="$(git show "origin/${BASE_REF}:pyproject.toml" | grep -E '^version = "' | head -1 | sed -E 's/version = "([^"]+)"/\1/')"

          echo "Base (${BASE_REF}) version: ${BASE_VERSION}"
          echo "Head version:            ${HEAD_VERSION}"

          # If the head branch already differs from base, the version was
          # already bumped in this PR (e.g. on an earlier run) -> do nothing.
          if [ "${HEAD_VERSION}" != "${BASE_VERSION}" ]; then
            echo "Version already bumped in this PR, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJ MIN PAT <<< "${HEAD_VERSION}"
          NEW_VERSION="${MAJ}.${MIN}.$((PAT + 1))"
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${NEW_VERSION}\"/" pyproject.toml

          echo "Bumped version: ${HEAD_VERSION} -> ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} for dependency update"
          git push
